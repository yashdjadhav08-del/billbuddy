[package]
name = "billbuddy"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "20.3.0", features = ["alloc"] }

[features]
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
soroban-sdk = { version = "20.3.0", features = ["testutils", "alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[patch.crates-io]
# soroban-env-common pins ethnum `=1.5.0`, which does not compile on recent
# rustc. Vendor the upstream-fixed source under the same version label.
ethnum = { path = "vendor/ethnum" }
